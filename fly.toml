# 注入命令示例（flyctl 里执行）：
# fly secrets set \
#   ADB_EMQX_HOST=o8cc1111.ala.cn-hangzhou.emqxsl.cn \
#   ADB_EMQX_PORT=8883 \
#   ADB_EMQX_APP_ID=o8cc1111 \
#   ADB_EMQX_APP_SECRET=EMQX控制台复制 \
#   ADB_EMQX_REST_ENDPOINT=https://o8cc1111.ala.cn-hangzhou.emqxsl.cn:8443 \
#   ADB_R2_ENDPOINT=https://696e933486bc331658bce6378aaceaea.r2.cloudflarestorage.com \
#   ADB_R2_BUCKET=slss-boby \
#   ADB_R2_ACCESS_KEY=R2控制台复制 \
#   ADB_R2_ACCESS_SECRET=R2控制台复制 \
#   ADB_MYSQL_HOST=mysql6.sqlpub.com \
#   ADB_MYSQL_PORT=3311 \
#   ADB_MYSQL_NAME=slss12 \
#   ADB_MYSQL_USER=slss12 \
#   ADB_MYSQL_PASSWORD=从SQLPub控制台复制 \
#   ADB_SERVER_URL=https://api.yourdomain.com \
#   SESSION_SECRET=openssl rand -hex 48（随机64字符）
#
# OTA 发布令牌(CI 经 X-Admin-Token 头调用 /api/updates/publish):
#   openssl rand -hex 24 生成,同一个值配到 controlled 仓库 Secrets 的 ADB_PM_TOKEN
#   fly secrets set ADB_PM_TOKEN=<随机64字符>

app = "adbcontrol-backend"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  # 配对 QR 码里写入的后端地址,必须是真实可访问的域名(原为占位符会导致 QR 指向假域名)
  ADB_SERVER_URL = "https://adbcontrol-backend.fly.dev"
  PORT = "8080"
  KTOR_ENV = "production"
  SESSION_SECURE = "true"
  # 防 OOM:免费机 256MB,曾因 /update/apk 流式中转 82MB APK 被 cgroup 杀进程
  # (anon-rss 154MB)。JVM 默认按 RAM 百分比算堆且 direct buffer 无上限,
  # 这里硬性封顶,给 page cache 留余量。gradle startScripts 启动脚本会读取 JAVA_OPTS。
  JAVA_OPTS = "-Xmx150m -XX:MaxDirectMemorySize=32m -Xss512k"
  # CORS 白名单(前端 Cloudflare Pages 域名)。取消注释并把域名换成你的 Pages 项目实际域名,
  # 或用 `fly secrets set CORS_ORIGINS=...` 注入(secrets 优先级高于此处 [env])。
  # 不配置则只放行 localhost,Pages 上的前端登录会被 CORS 拦截。
  # CORS_ORIGINS = "https://adbcontrol-web.pages.dev"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"
