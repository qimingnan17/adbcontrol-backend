# 手动触发的 Fly secrets 注入(本地无 flyctl 环境时的替代通道)。
# 触发方式:gh api -X POST repos/:owner/:repo/actions/workflows/set-secrets.yml/dispatches
# 输入值仅存在于 workflow run 元数据,不落入仓库文件。
name: Set Fly Secrets

on:
  workflow_dispatch:
    inputs:
      emqxAppId:
        description: 'ADB_EMQX_APP_ID'
        required: true
      emqxAppSecret:
        description: 'ADB_EMQX_APP_SECRET'
        required: true
      ingestUsername:
        description: 'ADB_EMQX_INGEST_USERNAME'
        required: true
      ingestPassword:
        description: 'ADB_EMQX_INGEST_PASSWORD'
        required: true

jobs:
  set-secrets:
    name: Apply secrets to adbcontrol-backend
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Apply secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set -a adbcontrol-backend \
            ADB_EMQX_APP_ID="${{ inputs.emqxAppId }}" \
            ADB_EMQX_APP_SECRET='${{ inputs.emqxAppSecret }}' \
            ADB_EMQX_INGEST_USERNAME='${{ inputs.ingestUsername }}' \
            ADB_EMQX_INGEST_PASSWORD='${{ inputs.ingestPassword }}'

      - name: List secret names (verify)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl secrets list -a adbcontrol-backend
