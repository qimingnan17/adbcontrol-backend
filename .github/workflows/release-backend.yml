name: Release and Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/release-backend.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout web frontend
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: 'qimingnan17/adbcontrol-web'
          path: 'web-frontend'

      - name: Set up Node.js
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web frontend
        continue-on-error: true
        run: |
          if [ -d "web-frontend" ]; then
            cd web-frontend
            npm install || true
            npm run build || true
            if [ -d "dist" ]; then
              mkdir -p ../backend/src/main/resources/static
              cp -r dist/* ../backend/src/main/resources/static/
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build backend distribution zip
        run: chmod +x ./gradlew && ./gradlew :backend:distZip --no-daemon

      - name: "Publish to GitHub Release (rolling tag: latest)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/artifacts
          cp backend/build/distributions/backend.zip /tmp/artifacts/backend.zip
          
          # Delete existing latest release/tag if exists so rolling release stays fresh
          gh release delete latest -y || true
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          
          gh release create latest /tmp/artifacts/backend.zip \
            --title "Backend Latest Release" \
            --notes "Automated backend release from commit $GITHUB_SHA"

      - name: Notify Cloud PC to Auto-Upgrade (best-effort)
        # 云电脑在 NAT 后没有公网入站，只能经 Cloudflare 命名隧道回调本机。
        # 回调地址与令牌在 Web 控制台「设置 → CI 部署」生成，复制到仓库 Secrets：
        #   CLOUD_PC_UPGRADE_URL = https://<你的域名>/api/admin/upgrade
        #   UPGRADE_TOKEN         = 与云电脑 secrets.properties 的 ci.upgrade_token 一致
        # 本步骤只是把等待从 10 分钟缩短到秒级；缺失或失败都不阻塞发布，
        # 云电脑端 update-poll.ps1 的出站轮询（每 10 分钟拉 latest Release）才是兜底。
        continue-on-error: true
        env:
          UPGRADE_URL: ${{ secrets.CLOUD_PC_UPGRADE_URL }}
          UPGRADE_TOKEN: ${{ secrets.UPGRADE_TOKEN }}
        run: |
          if [ -z "$UPGRADE_URL" ] || [ -z "$UPGRADE_TOKEN" ]; then
            echo "::notice::未配置 CLOUD_PC_UPGRADE_URL / UPGRADE_TOKEN，跳过主动通知。"
            echo "云电脑将在下一个轮询周期（≤10 分钟）自动部署本次构建。"
            exit 0
          fi
          # 令牌绝不回显到日志，也不再提供硬编码兜底值 ——
          # 兜底值一旦进过仓库就等于公开，任何人都能触发部署。
          echo "Notifying cloud PC via tunnel to pull and deploy the new release..."
          code=$(curl -s -o /tmp/upgrade-resp.txt -w '%{http_code}' -m 20 \
            -X POST "$UPGRADE_URL" \
            -H "X-Admin-Token: $UPGRADE_TOKEN" \
            -H "Content-Type: application/json" || echo "000")
          echo "HTTP $code"
          case "$code" in
            200) echo "Cloud PC triggered; it will pull the new release and hot-swap." ;;
            401) echo "::warning::401 未授权 —— UPGRADE_TOKEN 与云电脑 ci.upgrade_token 不一致（若近期轮换过令牌需同步更新 Secret）。" ;;
            000) echo "::warning::隧道不可达（连接超时/网络错误）。部署将由出站轮询兜底。" ;;
            *)   echo "::warning::收到 HTTP $code: $(head -c 200 /tmp/upgrade-resp.txt)" ;;
          esac
