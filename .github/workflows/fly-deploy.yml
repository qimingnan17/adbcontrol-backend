# 推送到 main 时,由 GitHub Actions 调用 Fly 远程构建器(remote builder)构建镜像并部署。
# 需要在仓库 Settings → Secrets and variables → Actions 里添加 FLY_API_TOKEN。
# 生成 token:fly tokens create deploy -a adbcontrol-backend
name: Fly Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency: deploy-group   # 串行化部署,避免并发发布互相覆盖
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only:镜像在 Fly 的远程构建器上构建(读取仓库根 Dockerfile / fly.toml),
      # runner 无需本地 Docker。
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
