# ==========================================================
# Fly.io 部署配置 —— 仅用于 backend 子目录部署。
#
# 使用方法(在仓库根目录执行,因为 build context 要包含 gradle wrapper + shared 模块):
#   cd /workspace
#   fly launch --config backend/fly.toml --dockerfile Dockerfile --no-deploy
#   fly secrets set ADB_EMQX_APP_SECRET=... ADB_R2_ACCESS_KEY=... ADB_R2_ACCESS_SECRET=... ADB_DB_PASSWORD=... SESSION_SECRET=$(openssl rand -hex 48)
#   fly deploy
#
# 完整环境变量清单见 secrets.properties.template,命名约定:
#   配置文件 key  db.password   → 环境变量 ADB_DB_PASSWORD
#   配置文件 key  emqx.app_secret → 环境变量 ADB_EMQX_APP_SECRET
# ==========================================================

app = "your-backend-app-name"  # TODO: 改成你自己的 fly app name,fly launch 会覆盖
primary_region = "hkg"

[build]
  # 用仓库根的 Dockerfile(它会 build backend + shared,产出 installDist)
  dockerfile = "../Dockerfile"

[env]
  # 部署完成后换成真实后端域名,用于生成配对 QR 码
  ADB_SERVER_URL = "https://your-backend-app-name.fly.dev"
  PORT = "8080"
  KTOR_ENV = "production"
  SESSION_SECURE = "true"

  # CORS 白名单:Web 端(Cloudflare Pages) + 本地调试。
  # 若使用通配符 pages.dev / fly.dev,当前 Cors.kt 已允许 endsWith;
  # 部署出具体域名后,推荐写完整具体域名更安全:
  #   https://adbcontrol-web-xxx.pages.dev,https://your-backend-app-name.fly.dev
  CORS_ORIGINS = "http://localhost:5173,http://localhost:4173"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "60s"   # Java 冷启动慢一点,给够时间
