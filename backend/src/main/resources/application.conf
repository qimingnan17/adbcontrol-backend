ktor {
    deployment {
        port = 8080
        host = "0.0.0.0"
        # 容器/云环境可用环境变量覆盖
        port = ${?PORT}
        host = ${?HOST}
    }
    application {
        modules = [ com.adbcontrol.backend.ApplicationKt.module ]
    }
}

# 会话 Cookie 与 CORS 配置。仅当对应环境变量存在时才覆盖(${?VAR} 缺省则保持未设置)。
# 代码读取:Cors.kt 读 cors.origins;Security.kt 读 session.secret/session.secure/session.same_site。
session {
    # HMAC 签名密钥(不设则每次重启随机生成,重启后旧会话失效)
    secret = ${?SESSION_SECRET}
    # 是否只在 HTTPS 下发送 cookie。跨站场景(SameSite=None)代码会强制为 true。
    secure = ${?SESSION_SECURE}
    # SameSite 属性。跨站前后端分离部署需设为 None;同站/本地可用 Lax。默认 None。
    same_site = ${?SESSION_SAMESITE}
}

cors {
    # 允许的精确来源,逗号分隔,如 https://adbcontrol-web.pages.dev（填你自己的 Pages 域名）。
    # 内置只放行 localhost:5173/4173（本地开发）;生产域名必须显式写在这里,
    # 不再对 *.pages.dev / *.workers.dev / *.fly.dev 等公共后缀整体放行。
    origins = ${?CORS_ORIGINS}
}
